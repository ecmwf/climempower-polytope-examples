        - biologically_effective_degree_days
        - cold_spell_duration_index
        - frost_days
        - growing_season_length
        - heavy_precipitation_days
        - ice_days
        - maximum_number_of_consecutive_dry_days
        - maximum_number_of_consecutive_frost_days
        - maximum_number_of_consecutive_summer_days
        - maximum_number_of_consecutive_wet_days
        - maximum_of_daily_maximum_temperature
        - maximum_of_daily_minimum_temperature
        - mean_of_daily_maximum_temperature
        - mean_of_daily_mean_temperature
        - mean_of_daily_minimum_temperature
        - mean_of_diurnal_temperature_range
        - minimum_of_daily_maximum_temperature
        - minimum_of_daily_minimum_temperature
        - precipitation_sum
        - simple_daily_intensity_index
        - summer_days
        - tropical_nights
        - very_heavy_precipitation_days
        - warm_and_wet_days
        - warm_spell_duration_index
        - wet_days
    period:
      required: true
      valid_values:
        - "195101_198012"
        - "198101_201012"
        - "201101_204012"
        - "204101_207012"
        - "207101_209912"
    temporal_aggregation:
      required: true
      valid_values:
        - 10_day
        - season
        - annual
    origin:
      required: false
      default: noresm1_m_model
      valid_values:
        - era_interim_reanalysis
        - gfdl_esm2m_model
        - hadgem2_es_model
        - ipsl_cm5a_lr_model
        - miroc_esm_chem_model
        - noresm1_m_model
    experiment:
      required: false
      default: rcp4_5
      valid_values:
        - historical
        - rcp2_6
        - rcp4_5
        - rcp6_0
        - rcp8_5
    version:
      required: false
      default: ["1_1"]
      valid_values:
        - "1_0"
        - "1_1"
  constraints:
    - description: "Historical experiment valid with historical periods"
      rule:
        experiment: [historical]
        period: ["195101_198012", "198101_201012"]
    - description: "Future experiments valid with future periods only"
      rule:
        experiment: [rcp2_6, rcp4_5, rcp6_0, rcp8_5]
        period: ["201101_204012", "204101_207012", "207101_209912"]
    - description: "era_interim_reanalysis ONLY available for period 198101_201012 (not 195101_198012)"
      rule:
        origin: [era_interim_reanalysis]
        period: ["198101_201012"]
        experiment: [historical]
    - description: "Variables determine temporal_aggregation: 10_day for most, season for spell indices, annual for growing_season_length"
      rule:
        temporal_aggregation: [10_day]
        variable: [biologically_effective_degree_days, frost_days, heavy_precipitation_days, ice_days, maximum_of_daily_maximum_temperature, maximum_of_daily_minimum_temperature, mean_of_daily_maximum_temperature, mean_of_daily_mean_temperature, mean_of_daily_minimum_temperature, mean_of_diurnal_temperature_range, minimum_of_daily_maximum_temperature, minimum_of_daily_minimum_temperature, precipitation_sum, simple_daily_intensity_index, summer_days, tropical_nights, very_heavy_precipitation_days, wet_days]
    - description: "Seasonal aggregation variables"
      rule:
        temporal_aggregation: [season]
        variable: [cold_spell_duration_index, maximum_number_of_consecutive_dry_days, maximum_number_of_consecutive_frost_days, maximum_number_of_consecutive_summer_days, maximum_number_of_consecutive_wet_days, warm_and_wet_days, warm_spell_duration_index]
    - description: "Annual aggregation only for growing_season_length"
      rule:
        temporal_aggregation: [annual]
        variable: [growing_season_length]

efas-seasonal:
  description: "Seasonal forecasts of river discharge by the European Flood Awareness System"
  temporal_coverage: "November 2020 to near real-time"
  horizontal_resolution: "1x1 arcminute (~1.5 km)"
  official_constraints: "constraints/efas-seasonal.json"
  dimensions:
    variable:
      required: true
      valid_values:
        - river_discharge
        - volumetric_soil_moisture
        - snow_depth_water_equivalent
        - soil_wetness_index
        - runoff_water_equivalent
        # Auxiliary (time-invariant)
        - elevation
        - upstream_area
        - soil_depth
        - wilting_point
        - field_capacity
    model_levels:
      required: false
      default: surface_level
      valid_values:
