sis-tourism-fire-danger-indicators:
  description: "Fire danger indicators for Europe from 1970 to 2098"
  temporal_coverage: "1970 to 2098"
  horizontal_resolution: "0.11° x 0.11°"
  official_constraints: "constraints/sis-tourism-fire-danger-indicators.json"
  dimensions:
    variable:
      required: true
      valid_values:
        - daily_fire_weather_index
        - fire_weather_index
        - seasonal_fire_weather_index
        - number_of_days_with_moderate_fire_danger
        - number_of_days_with_high_fire_danger
        - number_of_days_with_very_high_fire_danger
    period:
      required: true
      valid_values:
        - "1970_2005"
        - "2001_2005"
        - "2006_2010"
        - "2011_2040"
        - "2041_2070"
        - "2071_2098"
    time_aggregation:
      required: true
      valid_values:
        - daily_indicators
        - seasonal_indicators
        - annual_indicators
    product_type:
      required: false
      default: single_model
      valid_values:
        - single_model
        - multi_model_mean
        - multi_model_best_case
        - multi_model_worst_case
    gcm_model:
      required: false
      default: [ec_earth]
      valid_values:
        - ec_earth
        - hadgem2_es
        - mpi_esm_lr
        - cnrm_cm5
        - ipsl_cm5a_mr
    experiment:
      required: false
      default: historical
      valid_values:
        - historical
        - rcp2_6
        - rcp4_5
        - rcp8_5
    version:
      required: false
      default: v2_0
      valid_values:
        - v1_0
        - v2_0
  constraints:
    - description: "Historical experiment valid only with historical periods"
      rule:
        experiment: [historical]
        period: ["1970_2005", "2001_2005"]
    - description: "Future experiments valid with future periods"
      rule:
        experiment: [rcp2_6, rcp4_5, rcp8_5]
        period: ["2006_2010", "2011_2040", "2041_2070", "2071_2098"]
    - description: "Daily fire weather index only with daily_indicators time aggregation"
      rule:
        variable: [daily_fire_weather_index]
        time_aggregation: [daily_indicators]
    - description: "Seasonal fire weather index only with seasonal_indicators"
      rule:
        variable: [seasonal_fire_weather_index]
        time_aggregation: [seasonal_indicators]
    - description: "Multi-model products not available with single_model product_type"
      rule:
        product_type: [multi_model_mean, multi_model_best_case, multi_model_worst_case]

