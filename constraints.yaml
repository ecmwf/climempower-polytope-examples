        - duration_of_meteorological_droughts
        - magnitude_of_meteorological_droughts
        - relative_sea_level_rise
        - extreme_sea_level
        - snowfall_amount
        - warmest_three_day_period
        - high_utci_days
    temporal_aggregation:
      required: true
      valid_values:
        - monthly
        - seasonal
        - yearly
    origin:
      required: false
      default: projections
      valid_values:
        - projections
        - reanalysis
    gcm:
      required: false
      default: [ec_earth]
      valid_values:
        - ec_earth
        - hadgem2_es
        - mpi_esm_lr
        - cnrm_cm5
        - ipsl_cm5a_mr
        - noresm1_m
    rcm:
      required: false
      default: [racmo22e]
      valid_values:
        - racmo22e
        - cclm4_8_17
        - hirham5
        - rca4
        - remo2015
        - aladin63
    experiment:
      required: false
      default: [rcp4_5]
      valid_values:
        - rcp2_6
        - rcp4_5
        - rcp8_5
    ensemble_member:
      required: false
      default: [r1i1p1]
      valid_values:
        - r1i1p1
        - r12i1p1
        - r2i1p1
        - r3i1p1
    spatial_aggregation:
      required: false
      default: gridded
      valid_values:
        - gridded
        - nuts_0
        - nuts_1
        - nuts_2
        - nuts_3
  constraints:
    - description: "Reanalysis origin has no experiment/gcm/rcm dimensions"
      rule:
        origin: [reanalysis]
    - description: "Hydrology variables (flood_recurrence, mean_river_discharge, aridity_actual, mean_soil_moisture) use different underlying dataset"
      rule:
        variable: [flood_recurrence, mean_river_discharge, aridity_actual, mean_soil_moisture]
        temporal_aggregation: [yearly]
    - description: "Sea level variables only available at yearly aggregation"
      rule:
        variable: [relative_sea_level_rise, extreme_sea_level]
        temporal_aggregation: [yearly]

sis-agroclimatic-indicators:
  description: "Agroclimatic indicators from 1951 to 2099"
  temporal_coverage: "1951 to 2099"
  horizontal_resolution: "0.5° x 0.5°"
  official_constraints: "constraints/sis-agroclimatic-indicators.json"
  dimensions:
