# =============================================================================
# Dataset Constraints
# =============================================================================
# Defines the valid combinations of dimension values for each dataset.
# Each dataset lists its dimensions with:
#   - valid_values: all accepted values (from CDS documentation)
#   - required: whether the user must supply this dimension
#   - default: the default value if not supplied
#   - constraints: rules linking this dimension to others
#
# IMPORTANT: The definitive valid combinations are in the per-dataset JSON files
# in the constraints/ directory, downloaded from the CDS API. Each JSON file is
# an array of objects where each object represents one valid combination of ALL
# parameters. A request is valid only if it matches at least one entry.
#
# This YAML provides a human-readable summary. For programmatic validation,
# use the JSON files.
#
# Sources: CDS/EWDS API constraint endpoints (official), dataset documentation.
# To refresh: python constraints/download_constraints.py
# =============================================================================

sis-heat-and-cold-spells:
  description: "Heat waves and cold spells in Europe derived from climate projections"
  temporal_coverage: "1986 to 2085"
  horizontal_resolution: "0.1° x 0.1°"
  official_constraints: "constraints/sis-heat-and-cold-spells.json"
  dimensions:
    variable:
      required: true
      valid_values:
        - cold_spell_days
        - heat_wave_days
    definition:
      required: false
      default: country_related
      valid_values:
        - climatological_related
        - health_related
        - country_related
    experiment:
      required: false
      default: [rcp8_5]
      valid_values:
        - rcp4_5
        - rcp8_5
    ensemble_statistic:
      required: false
      default: [ensemble_members_average]
      valid_values:
        - ensemble_members_average
        - ensemble_members_standard_deviation
  constraints:
    - description: "cold_spell_days ONLY available with definition=country_related"
      rule:
        variable: [cold_spell_days]
        definition: [country_related]
    - description: "heat_wave_days available with ALL three definitions"
      rule:
        variable: [heat_wave_days]
        definition: [climatological_related, health_related, country_related]

sis-hydrology-variables-derived-projections:
  description: "Hydrology-related climate impact indicators from 1970 to 2100"
  temporal_coverage: "1970 to 2100"
  horizontal_resolution: "5km x 5km and catchments"
  official_constraints: "constraints/sis-hydrology-variables-derived-projections.json"
  dimensions:
    variable:
      required: true
      valid_values:
        - river_discharge
        - mean_runoff
        - mean_soil_moisture
        - maximum_river_discharge
        - minimum_river_discharge
        - flood_recurrence_2_years_return_period
        - flood_recurrence_5_years_return_period
        - flood_recurrence_10_years_return_period
        - flood_recurrence_50_years_return_period
        - aridity_actual
        - aridity_potential
        - wetness_actual
        - wetness_potential
        - total_nitrogen_concentration_in_catchments
        - total_nitrogen_concentration_in_local_streams
        - total_nitrogen_load_in_catchments
        - total_phosphorus_concentration_in_catchments
        - total_phosphorus_concentration_in_local_streams
        - total_phosphorus_load_in_catchments
        - water_temperature_in_catchments
        - water_temperature_in_local_streams
    period:
      required: true
      valid_values:
        - "1971_2000"
        - "2011_2040"
        - "2041_2070"
        - "2071_2100"
        # Degree scenario periods
        - "1_5_c"
        - "2_0_c"
        - "3_0_c"
        # Decade periods (for essential_climate_variables / daily)
        - "1971_1980"
        - "1981_1990"
        - "1991_2000"
        - "2001_2005"
        - "2006_2010"
        - "2011_2020"
        - "2021_2030"
        - "2031_2040"
        - "2041_2050"
        - "2051_2060"
        - "2061_2070"
        - "2071_2080"
        - "2081_2090"
        - "2091_2100"
    time_aggregation:
      required: true
      valid_values:
        - annual_mean
        - monthly_mean
        - daily
    product_type:
      required: false
      default: climate_impact_indicators
      valid_values:
        - climate_impact_indicators
        - essential_climate_variables
    variable_type:
      required: false
      default: absolute_values
      valid_values:
        - absolute_values
        - relative_change
        - absolute_change
    experiment:
      required: false
      default: [historical]
      valid_values:
        - historical
        - rcp_2_6
        - rcp_4_5
        - rcp_8_5
        - degree_scenario
    hydrological_model:
      required: false
      default: [e_hypegrid]
      valid_values:
        - e_hypegrid
        - e_hypecatch_m00
        - e_hypecatch_m01
        - e_hypecatch_m02
        - e_hypecatch_m03
        - e_hypecatch_m04
        - e_hypecatch_m05
        - e_hypecatch_m06
        - e_hypecatch_m07
        - vic_wur
    rcm:
      required: false
      default: csc_remo2009
      valid_values:
        - csc_remo2009
        - cclm4_8_17
        - hirham5
        - racmo22e
        - rca4
    gcm:
      required: false
      default: mpi_esm_lr
      valid_values:
        - mpi_esm_lr
        - ec_earth
        - hadgem2_es
        - ipsl_cm5a_mr
        - cnrm_cm5
    ensemble_member:
      required: false
      default: [r1i1p1]
      valid_values:
        - r1i1p1
        - r12i1p1
        - r2i1p1
        - r3i1p1
  constraints:
    - description: "Historical experiment only valid with reference period 1971-2000 (for CIIs) or decade periods (for ECVs)"
      rule:
        experiment: [historical]
        period: ["1971_2000"]
    - description: "Future experiments valid with future periods"
      rule:
        experiment: [rcp_2_6, rcp_4_5, rcp_8_5]
        period: ["2011_2040", "2041_2070", "2071_2100"]
    - description: "Degree scenarios use degree_scenario experiment"
      rule:
        experiment: [degree_scenario]
        period: ["1_5_c", "2_0_c", "3_0_c"]
    - description: "Essential climate variables: only river_discharge with daily resolution"
      rule:
        product_type: [essential_climate_variables]
        variable: [river_discharge]
        time_aggregation: [daily]
    - description: "Water quality vars (nitrogen, phosphorus, water_temperature) only with e_hypecatch models"
      rule:
        variable: [total_nitrogen_concentration_in_catchments, total_nitrogen_concentration_in_local_streams, total_nitrogen_load_in_catchments, total_phosphorus_concentration_in_catchments, total_phosphorus_concentration_in_local_streams, total_phosphorus_load_in_catchments, water_temperature_in_catchments, water_temperature_in_local_streams]
        hydrological_model: [e_hypecatch_m00, e_hypecatch_m01, e_hypecatch_m02, e_hypecatch_m03, e_hypecatch_m04, e_hypecatch_m05, e_hypecatch_m06, e_hypecatch_m07]
    - description: "GCM ec_earth requires ensemble_member r12i1p1; hadgem2_es and mpi_esm_lr require r1i1p1"
      rule:
        gcm: [ec_earth]
        ensemble_member: [r12i1p1]
    - description: "RCMs available per GCM: ec_earth->cclm4_8_17/racmo22e/rca4; hadgem2_es->racmo22e/rca4; mpi_esm_lr->csc_remo2009/rca4"
      rule:
        gcm: [mpi_esm_lr]
        rcm: [csc_remo2009, rca4]

