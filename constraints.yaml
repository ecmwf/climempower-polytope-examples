# =============================================================================
# Spatial Feature Constraints (common to all datasets)
# =============================================================================
spatial_features:
  types:
    - boundingbox
    - polygon
  boundingbox:
    description: "Two coordinate pairs: [[lat_min, lon_min], [lat_max, lon_max]]"
    coordinate_count: 2
  polygon:
    description: "Closed ring of coordinate pairs: [[lat1, lon1], ..., [lat1, lon1]]"
    min_coordinate_count: 4  # minimum 3 vertices + closing point
